name: CI

on:
  # The Swift edition ships from `main`. The frozen Tauri edition is preserved on `tauri-legacy`.
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      icloud_history:
        description: 'History container: production joins Macs running released OpenUsage (explicit opt-in)'
        type: choice
        required: true
        default: development
        options:
          - development
          - production
      package:
        description: 'personal: optimized build for daily use, versioned from the upstream base tag, no telemetry'
        type: choice
        required: true
        default: development
        options:
          - development
          - personal

permissions:
  contents: read

# Don't spend two macOS runners on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and Test
    # Build with Swift 6.2 and the macOS 26 SDK, but target Monterey (Package.swift .macOS(.v12)).
    # Availability checking compiles both the legacy and modern branches. The tests explicitly force
    # the Monterey image renderer too. A complete Monterey UI smoke pass still needs a Monterey Mac.
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Personal packages derive their version from the nearest upstream tag and commit count.
          fetch-depth: ${{ inputs.package != 'personal' && 1 || 0 }}

      - name: Check build environment
        id: environment
        run: |
          source script/macos_support.sh
          require_build_toolchain
          uname -m
          swift --version
          xcrun --sdk macosx --show-sdk-version
          echo "toolchain=$({ swift --version; xcrun --sdk macosx --show-sdk-build-version; } | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore Swift build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.environment.outputs.toolchain }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.environment.outputs.toolchain }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.environment.outputs.toolchain }}-

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: Stage and verify Monterey-compatible app
        env:
          PACKAGE: ${{ inputs.package || 'development' }}
          CODESIGN_IDENTITY: "-"
          ICLOUD_CONTAINER_ID: ${{ inputs.icloud_history == 'production' && 'iCloud.com.robinebers.openusage' || 'iCloud.com.robinebers.openusage.dev' }}
        run: |
          if [ "$PACKAGE" = personal ]; then
            # An unofficial build: label it from the upstream base it carries, never a new release number.
            base="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
            export CONFIG=release TELEMETRY=off
            export APP_VERSION_LABEL="${base#v}-monterey" APP_BUILD="$(git rev-list --count HEAD)"
          else
            export CONFIG=debug
          fi
          ./script/build_and_run.sh build
          ditto -c -k --keepParent dist/OpenUsage.app dist/OpenUsage-Monterey.zip

      - name: Upload compatibility build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('OpenUsage-Monterey{0}{1}', inputs.package == 'personal' && '-personal' || '', inputs.icloud_history == 'production' && '-production-history' || '') }}
          path: dist/OpenUsage-Monterey.zip
          if-no-files-found: error
          # Personal packages are for downloading once and installing, not for sharing.
          retention-days: ${{ inputs.package == 'personal' && 1 || 14 }}

      - name: Upload dependency lockfile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenUsage-build-metadata
          path: Package.resolved
          if-no-files-found: error
          retention-days: 14

      # Preserve expensive SwiftSyntax compilation even when app compilation fails.
      - name: Save Swift build cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
